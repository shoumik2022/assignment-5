<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issue Tracker | Login</title>

    <!-- tailwind+daisy  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icons  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[100px] mx-auto pt-32 ">
        <img src="assets/github-logo.png" alt="GitHub Logo">
    </div>
    <div class="text-center pt-4">
        <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
        <h3 class="font-bold opacity-60">Sign in to manage your issues</h3>
    </div>
    <div class="form pt-10">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">

                    <label class="label text-neutral font-bold">Username</label>
                    <input id="input-username" type="text" class="input rounded-full bg-base-200"
                        placeholder="Enter your username" />
                        <p id="username-error" class="text-blue-500 text-sm">Default: admin</p>

                    <br>

                    <label class="label text-neutral font-bold">Password</label>
                    <input id="input-password" type="password" class="input rounded-full bg-base-200"
                        placeholder="Enter your password" />
                        <p id="password-error" class="text-blue-500 text-sm">Default: admin123</p>

                    <div></div>

                    <button id="signin-btn" class="btn btn-primary mt-4 rounded-full">
                        Sign In
                    </button>

                </fieldset>
            </div>
            <h2 class="text-center font-bold text-xl">OR</h2>
            <br>
            <p class="text-center opacity-50">Demo Credentials:</p>
            <br><br>
            <div class="flex">
                <p class="font-bold">Username:</p>
                <p class="opacity-60">admin</p>
            </div>
            <div class="flex">
                <p class="font-bold">Password:</p>
                <p class="opacity-60">admin123</p>
            </div>
        </div>
    </div>
    <script src="scripts/signin.js"></script>
</body>

</html>
